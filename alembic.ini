# Alembic Configuration File
# This file is read by `alembic` CLI commands.

[alembic]
# Path to migrations scripts
script_location = alembic

# SQLAlchemy connection string — inherited from .env at runtime (see env.py)
sqlalchemy.url = postgresql+psycopg2://rag_user:rag_password@localhost:5432/rag_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
